[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fanet"
version = "0.1.0"
description = "FANet: Feedback Attention Network for biomedical image segmentation (reproduction + feedback analysis)"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "opencv-python",
    "albumentations",
    "scikit-learn",
    "tqdm",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
